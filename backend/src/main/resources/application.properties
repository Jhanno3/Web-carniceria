spring.application.name=backend

server.port=${PORT:8080}

# Los ":" dejan un default vacío: en tests, Testcontainers y el JwtDecoder de test reemplazan
# estas dos cosas por completo, así que no hace falta tener las variables reales seteadas.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# El esquema lo maneja supabase/migrations (SQL a mano), nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Supabase firma los JWT con ES256 (ECDSA), no RS256. El auto-configurado de Spring solo
# acepta RS256 por default si no se lo decimos explícitamente.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL:}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mercadopago-access-token=${MERCADOPAGO_ACCESS_TOKEN:}
